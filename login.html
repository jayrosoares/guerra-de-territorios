<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0e">
  <title>Guerra de Territórios – Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { display: grid; place-items: center; overflow: auto;
      min-height: 100vh; margin: 0;
      background:
        linear-gradient(rgb(9 11 14 / 45%), rgb(9 11 14 / 70%)),
        url("territoriodeguerra.png") center/cover no-repeat fixed,
        radial-gradient(ellipse at center, #171b21 0%, #090b0e 72%); }
    .login-card { width: min(380px, calc(100% - 32px)); padding: 32px 26px; text-align: center;
      border: 1px solid #333a44; border-radius: 16px; background: rgb(12 15 19 / 88%);
      box-shadow: 0 18px 60px rgb(0 0 0 / 55%); backdrop-filter: blur(10px); }
    .login-card h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 0.05em; }
    .login-card p { margin: 0 0 24px; color: #9ca6b2; font-size: 13px; }
    .teams { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
    .teams span { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
    #googleBtn { display: flex; justify-content: center; min-height: 44px; }
    #msg { margin-top: 14px; font-size: 12px; color: #ff8f9a; min-height: 16px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="teams">
      <span style="background:#1f6fd6;color:#1f6fd6"></span>
      <span style="background:#1fb84f;color:#1fb84f"></span>
      <span style="background:#d01f30;color:#d01f30"></span>
      <span style="background:#e8c40f;color:#e8c40f"></span>
    </div>
    <h1>GUERRA DE TERRITÓRIOS</h1>
    <p>Entre com sua conta Google para jogar</p>
    <div id="googleBtn"></div>
    <div id="msg"></div>
  </main>

  <script>
    const CLIENT_ID = "SEU_CLIENT_ID.apps.googleusercontent.com";

    // Decodifica o token JWT retornado pelo Google
    function parseJwt(token) {
      const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(atob(b64).split("").map(
        c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
    }

    function onLogin(response) {
      try {
        const u = parseJwt(response.credential);
        sessionStorage.setItem("gtUser", JSON.stringify({ name: u.name, email: u.email, picture: u.picture }));
        window.location.href = "index.html";
      } catch {
        document.getElementById("msg").textContent = "Falha no login. Tente novamente.";
      }
    }

    window.onload = () => {
      if (!window.google) {
        document.getElementById("msg").textContent = "Não foi possível carregar o Google.";
        return;
      }
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onLogin });
      google.accounts.id.renderButton(document.getElementById("googleBtn"),
        { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "pt-BR" });
    };
  </script>

  <!--

      if (!sessionStorage.getItem("gtUser")) location.replace("login.html");

    const logoutBtn = document.createElement("button");
    logoutBtn.textContent = "Sair";
    logoutBtn.onclick = () => { sessionStorage.removeItem("gtUser"); location.href = "login.html"; };
    document.querySelector(".controls").appendChild(logoutBtn);
  -->
</body>
</html>
